<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — FS AI</title>
<meta name="description" content="Read a free FS AI article.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="FS AI">
<meta property="og:title" content="Article — FS AI">
<meta property="og:description" content="Read a free FS AI article.">
<meta property="og:image" content="https://fs-ai-5w5.pages.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FS AI — One Platform. Multiple Possibilities.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Article — FS AI">
<meta name="twitter:description" content="Read a free FS AI article.">
<meta name="twitter:image" content="https://fs-ai-5w5.pages.dev/og-image.png">
<!-- Per-article title, description, canonical and JSON-LD are injected by
     JavaScript from the loaded article (see the script at the end of this
     page). No static canonical or og:url is shipped: one shared URL would
     be wrong for every article, and a wrong canonical is worse than
     none. Crawlers that do not run JavaScript will see only these generic
     tags — static Pages hosting has no server rendering. -->
<link rel="stylesheet" href="../styles/main.css">
<link rel="stylesheet" href="../styles/responsive.css">
<link rel="stylesheet" href="../styles/animations.css">
<!-- Theme before first paint: saved choice wins, else OS preference (see navigation.js). -->
<script>try{var __fsaiTheme=localStorage.getItem('fsai-theme');if(__fsaiTheme==='light'||(!__fsaiTheme&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="../styles/ui-styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader" data-active="Divisions"></div>
<main id="main">
  <section class="section">
    <div class="wrap article-body" id="articleBody">
      <p class="muted">Loading article…</p>
    </div>
    <div class="wrap" id="seriesNav"></div>
    <div class="wrap">
      <h2>Related guides</h2>
      <div class="grid" id="relatedGrid"></div>
      <p class="muted"><a href="../">← Back to home</a> · <a href="division">All divisions</a></p>
    </div>
  </section>
</main>
<div id="siteFooter"></div>
<script src="../scripts/app.js"></script>
<script src="../scripts/navigation.js"></script>
<script src="../scripts/animations.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* Phase 2: wait for the live merge so a newly published article is
     found by articleById instead of showing "Article not found". The
     fallback resolves immediately when liveReady is absent (old cached
     app.js) — the page then renders from the static bundle as before. */
  var liveReady = (window.FSAI && window.FSAI.liveReady) || Promise.resolve();
  liveReady.then(function () {
  var params = new URLSearchParams(window.location.search);
  var a = window.FSAI.articleById(params.get('id'));
  var body = document.getElementById('articleBody');
  if (!a) {
    document.title = 'Article not found — FS AI';
    body.innerHTML = '<h1>Article not found</h1><p>That article does not exist. <a href="../">Browse all articles on the home page</a>.</p>';
    return;
  }
  document.title = a.title + ' — FS AI';
  var div = window.FSAI.DIVISIONS.find(function (d) { return d.name === a.division; });
  /* Per-article SEO, injected from the loaded article data. Honest note:
     this only exists after JavaScript runs — a crawler that does not run
     JS sees the generic tags in <head>. */
  var canonical = 'https://fs-ai-5w5.pages.dev/pages/article?id=' + a.id;
  function setMeta(name, value, attr) {
    var sel = attr === 'property' ? 'meta[property="' + name + '"]' : 'meta[name="' + name + '"]';
    var el = document.querySelector(sel);
    if (!el) {
      /* No static tag is shipped for this value (e.g. og:url, which is
         per-article) — create it so the injected value still lands. */
      el = document.createElement('meta');
      el.setAttribute(attr, name);
      document.head.appendChild(el);
    }
    el.setAttribute('content', value);
  }
  function setLink(rel, href) {
    var el = document.querySelector('link[rel="' + rel + '"]');
    if (!el) {
      /* No static canonical is shipped (one shared URL would be wrong
         for every article) — create the link so the per-article
         canonical still lands. */
      el = document.createElement('link');
      el.setAttribute('rel', rel);
      document.head.appendChild(el);
    }
    el.setAttribute('href', href);
  }
  setMeta('description', a.excerpt, 'name');
  setMeta('og:title', a.title + ' — FS AI', 'property');
  setMeta('og:description', a.excerpt, 'property');
  setMeta('og:url', canonical, 'property');
  setMeta('og:image', 'https://fs-ai-5w5.pages.dev/og-image.png', 'property');
  setMeta('twitter:title', a.title + ' — FS AI', 'name');
  setMeta('twitter:description', a.excerpt, 'name');
  setMeta('twitter:image', 'https://fs-ai-5w5.pages.dev/og-image.png', 'name');
  setMeta('twitter:card', 'summary_large_image', 'name');
  /* A3: og article properties — published date (from a.date, the Set B
     published date), the division as the section, the category as the tag.
     No modified-date field: neither the static bundle nor the live loader
     carries a modified date, and inventing one would be false. */
  setMeta('article:published_time', a.date, 'property');
  setMeta('article:section', a.division, 'property');
  if (a.category) setMeta('article:tag', a.category, 'property');
  setLink('canonical', canonical);
  var ld = {
    '@context': 'https://schema.org', '@type': 'Article',
    headline: a.title, description: a.excerpt,
    datePublished: a.date, inLanguage: 'en',
    author: { '@type': 'Person', name: 'Fahad Somrat' },
    publisher: { '@type': 'Organization', name: 'FS AI', url: 'https://fs-ai-5w5.pages.dev/' },
    mainEntityOfPage: canonical,
    articleSection: a.division
  };
  var oldLd = document.getElementById('articleJsonLd');
  if (oldLd) oldLd.remove();
  var ldEl = document.createElement('script');
  ldEl.id = 'articleJsonLd';
  ldEl.type = 'application/ld+json';
  ldEl.textContent = JSON.stringify(ld);
  document.head.appendChild(ldEl);
  var crumbs = {
    '@context': 'https://schema.org', '@type': 'BreadcrumbList',
    itemListElement: [
      { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://fs-ai-5w5.pages.dev/' },
      { '@type': 'ListItem', position: 2, name: a.division, item: div ? 'https://fs-ai-5w5.pages.dev/pages/division?division=' + div.id : 'https://fs-ai-5w5.pages.dev/pages/division' },
      { '@type': 'ListItem', position: 3, name: a.title, item: canonical }
    ]
  };
  var oldCr = document.getElementById('articleCrumbs');
  if (oldCr) oldCr.remove();
  var crEl = document.createElement('script');
  crEl.id = 'articleCrumbs';
  crEl.type = 'application/ld+json';
  crEl.textContent = JSON.stringify(crumbs);
  document.head.appendChild(crEl);
  var disclaimer = a.disclaimer || window.FSAI.DISCLAIMER;
  var showDisclaimer = !!a.disclaimer || div && (div.id === 'health-wellness' || div.id === 'finance-money');
  body.innerHTML =
    '<p class="card-tag">' + window.FSAI.esc(a.division) + ' · ' + window.FSAI.esc(a.category) + '</p>' +
    '<h1>' + window.FSAI.esc(a.title) + '</h1>' +
    '<p class="article-meta"><span class="article-no">Topic ' + window.FSAI.divisionTopicNo(a) + '</span> · Published ' + window.FSAI.formatDate(a.date) + ' · FS AI · ' +
    (div ? '<a href="division?division=' + div.id + '">' + window.FSAI.esc(div.name) + '</a>' : window.FSAI.esc(a.division)) + '</p>' +
    '<figure class="article-hero"><img class="article-hero-img" src="' + window.FSAI.articleImage(a) + '" alt="' + window.FSAI.esc(a.title) + '" width="1600"></figure>' +
    (showDisclaimer ? '<p class="disclaimer-banner" role="note"><strong>Disclaimer:</strong> ' + window.FSAI.esc(disclaimer) + '</p>' : '') +
    '<p><strong>' + window.FSAI.esc(a.excerpt) + '</strong></p>' +
    (a.body ? '<div class="article-full">' + window.FSAI.renderBody(a.body) + '</div>' : '<p>The full text of this guide is coming soon.</p>') +
    '<p>Found this useful? Explore the <a href="tools">free tools</a> — including the calculators that go with this topic — or explore the related guides below.</p>';
  /* Reading sequence (owner order 2026-11-27): the series nav — "Part
     X of Y" + next-guide link — renders between the article body and
     the related section below. Empty string on articles outside any
     arc, so nothing extra appears there. */
  var seriesNav = document.getElementById('seriesNav');
  seriesNav.innerHTML = window.FSAI.renderSeriesNav(a);
  var related = window.FSAI.relatedArticles(a);
  var grid = document.getElementById('relatedGrid');
  grid.innerHTML = related.map(function (x) {
    return '<article class="card article-card"><img class="card-img" src="' + window.FSAI.articleImage(x) + '" alt="" loading="lazy" width="1600">' +
      '<div class="card-tag">' + window.FSAI.esc(x.division) + ' · ' + window.FSAI.esc(x.category) + '</div>' +
      '<h3><a href="article?id=' + x.id + '">' + window.FSAI.esc(x.title) + '</a></h3>' +
      '<p>' + window.FSAI.esc(x.excerpt) + '</p><time datetime="' + x.date + '">' + window.FSAI.formatDate(x.date) + '</time> <span class="article-no">Topic ' + window.FSAI.divisionTopicNo(x) + '</span></article>';
  }).join('') || '<p>No related guides yet.</p>';
  });
});
</script>
</body>
</html>
