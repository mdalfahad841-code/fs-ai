name: Push source once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-source:
    runs-on: ubuntu-latest
    env:
      SRC: fs-ai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack source zip and flatten
        env:
          SRC: fs-ai
        run: |
          set -e
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          unzip -o fs-ai-source.zip
          if [ -d "$SRC/frontend" ]; then cp -a "$SRC/." .; fi
          rm -rf "$SRC" fs-ai-source.zip
          test -f frontend/index.html
          test -f package.json
      - name: Squash into one clean commit on top of base
        run: |
          set -e
          git config user.name "mdalfahad841-code"
          git config user.email "mdalfahad841@gmail.com"
          rm -f .github/workflows/push-source-once.yml
          git add -A
          git reset --soft HEAD~2
          git add -A
          git commit -m "FS AI: live articles loader + scheduled sitemap refresh (autonomy fix phase 2)"
          git push --force origin main
