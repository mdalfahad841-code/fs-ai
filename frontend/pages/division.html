<!-- Per-division title/description/canonical are updated by JavaScript when
     ?division= is present; crawlers without JS see these generic tags. -->
<link rel="stylesheet" href="../styles/main.css">
<link rel="stylesheet" href="../styles/responsive.css">
<link rel="stylesheet" href="../styles/animations.css">
<link rel="stylesheet" href="../styles/themes.css">

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="siteHeader" data-active="Divisions"></div>
<main id="main">
  <section class="section">
    <div class="wrap">
      <h1 id="divisionTitle">All divisions</h1>
      <p class="lead" id="divisionIntro">Eight divisions, one platform. Choose a division to see its articles.</p>
      <div class="grid" id="divisionGrid"></div>
      <h2 id="divisionArticlesHeading" style="margin-top:40px;">Articles</h2>
      <div class="grid" id="divisionArticles"></div>
      <p class="muted" id="divisionBackLinks"><a href="../index.html">← Back to home</a></p>
    </div>
  </section>
</main>
<div id="siteFooter"></div>
<script src="../scripts/app.js"></script>
<script src="../scripts/navigation.js"></script>
<script src="../scripts/animations.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('division');
  var state = window.FSAI.divisionPageState(id);
  var div = state.division;
  var title = document.getElementById('divisionTitle');
  var intro = document.getElementById('divisionIntro');
  var grid = document.getElementById('divisionArticles');
  var heading = document.getElementById('divisionArticlesHeading');
  var all = document.getElementById('divisionGrid');
  var back = document.getElementById('divisionBackLinks');
  if (state.status === 'not-found') {
    /* Unknown slug: say so plainly instead of showing the generic
       all-divisions view as if nothing was wrong. */
    document.title = 'Division not found — FS AI';
    title.textContent = 'Division not found';
    intro.textContent = 'There is no division called "' + state.slug + '". Please check the spelling, or browse all divisions.';
    heading.style.display = 'none';
    grid.innerHTML = '';
    if (all) all.style.display = 'none';
    if (back) back.innerHTML = '<a href="division.html">← Browse all divisions</a> · <a href="../index.html">← Back to home</a>';
    return;
  }
  if (div) {
    document.title = div.name + ' — FS AI';
    var divCanonical = 'https://fs-ai-5w5.pages.dev/pages/division.html?division=' + div.id;
    var descEl = document.querySelector('meta[name="description"]');
    if (descEl) descEl.setAttribute('content', div.description);
    var ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', div.name + ' — FS AI');
    var ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute('content', div.description);
    var ogUrl = document.querySelector('meta[property="og:url"]');
    if (ogUrl) ogUrl.setAttribute('content', divCanonical);
    var canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.setAttribute('href', divCanonical);
    title.textContent = div.icon + ' ' + div.name;
    intro.textContent = div.description;
    heading.textContent = 'Articles in ' + div.name;
    var list = window.FSAI.articlesByDivision(div.name);
    if (list.length) {
      grid.innerHTML = list.map(function (a) {
        return '<article class="card article-card"><div class="card-tag">' + window.FSAI.esc(a.category) + '</div>' +
          '<h3><a href="article.html?id=' + a.id + '">' + window.FSAI.esc(a.title) + '</a></h3>' +
          '<p>' + window.FSAI.esc(a.excerpt) + '</p><time datetime="' + a.date + '">' + window.FSAI.formatDate(a.date) + '</time></article>';
      }).join('');
    } else {
      grid.innerHTML = '<p>No articles in this division yet.</p>';
    }
    /* Hide the full grid when a single division is open, keep the choice visible. */
    if (all) all.style.display = 'none';
  } else {
    grid.innerHTML = '';
    heading.textContent = 'Latest articles';
    window.FSAI.renderArticles(grid);
  }
});
</script>
</body>
</html>
