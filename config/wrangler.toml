# FS AI — FAHAD SOMRAT AI — Cloudflare Workers configuration (free tier only)
# This file configures the WORKER (API + agents). The static frontend is
# served by Cloudflare Pages — its build output directory ("frontend") is
# set in the Pages project settings in the Cloudflare dashboard, NOT here.
# (pages_build_output_dir is a Pages setting and is not valid in this file.)

name = "fs-ai"
# Paths in this file are resolved relative to THIS file (config/), so the
# entry point at the repo root is ../src/index.js. src/index.js is a thin
# wrapper that re-exports the real handler in backend/worker.js.
main = "../src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding (the code reads env.DB).
# database_id set 2026-11-12 from the owner's real D1 database fs-ai-db,
# created in the Cloudflare dashboard. Until the schema is applied,
# `wrangler deploy` succeeds but the Worker runs in fallback mode for
# reads and 503 "not configured" for writes. Apply database/schema.sql
# then database/seed.sql (see README "How to deploy").
[[d1_databases]]
binding = "DB"
database_name = "fs-ai-db"
database_id = "5043ece5-a853-433c-95f1-ee15a12b6b56"

# Workers AI binding (the code reads env.AI). Free tier: 10,000
# Neurons/day, resets 00:00 UTC, no card — on Workers Free, requests
# above the cap fail (error 3036) instead of billing anything. The LLM
# layer (backend/llm/) enforces a 9,000-Neuron/day cap in code before
# calling, and falls back to Groq/Gemini only when their keys exist.
[ai]
binding = "AI"

[vars]
SITE_NAME = "FS AI"
SITE_FULL_NAME = "FAHAD SOMRAT AI"
TAGLINE = "One Platform. Multiple Possibilities."
PUBLIC_SITE_URL = "https://fs-ai-5w5.pages.dev"
# Honest defaults — never invent traffic or revenue:
TRAFFIC_STATUS = "Data unavailable"
TOTAL_REVENUE_USD = "0.00"

# [observability]
# enabled = true

# Cron triggers (free tier): one hourly check that publishes ONLY
# owner-approved articles whose publish_at has passed. It runs no other
# automation and never publishes drafts or unapproved content. The
# Emergency Stop flag skips the run entirely.
[triggers]
crons = ["0 * * * *"]
